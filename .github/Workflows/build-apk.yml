name: Build Web to APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Salin file web ke folder www
        run: |
          mkdir -p www
          for item in *; do
            if [ "$item" != "www" ] && [ "$item" != ".github" ]; then
              cp -r "$item" www/
            fi
          done

      - name: Inisialisasi Capacitor & tambah Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Penjualan DV26" "com.agengdiva.penjualandv26" --web-dir=www
          npx cap add android

      - name: Build APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload file APK
        uses: actions/upload-artifact@v4
        with:
          name: penjualan-dv26-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build Web to APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependensi proyek
        run: npm install --legacy-peer-deps

      - name: Build proyek web (Vite)
        run: npm run build

      - name: Pasang Capacitor & siapkan Android
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Penjualan DV26" "com.agengdiva.penjualandv26" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Build APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload file APK
        uses: actions/upload-artifact@v4
        with:
          name: penjualan-dv26-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
